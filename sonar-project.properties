# SonarCloud Configuration
# https://docs.sonarcloud.io/advanced-setup/ci-based-analysis/sonarscanner-for-npm/

# Project identification
# These are set dynamically in the workflow, but can be overridden here
# sonar.projectKey=your-org_devopsfoundry
# sonar.organization=your-org

# Project information
sonar.projectName=DevOps Foundry
sonar.projectVersion=1.0.0

# Source settings
sonar.sources=src,content
sonar.tests=
sonar.exclusions=**/node_modules/**,**/.next/**,**/public/**,**/*.config.*,**/patches/**

# TypeScript/JavaScript settings
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis settings
sonar.eslint.reportPaths=eslint-report.json
sonar.coverage.exclusions=**/*.config.*,**/patches/**

# Quality Gate - fail the pipeline if quality gate fails
sonar.qualitygate.wait=true

